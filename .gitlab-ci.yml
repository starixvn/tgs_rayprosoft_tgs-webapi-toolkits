include:
  - project: rayprosoft/tgs-ci-scripts
    ref: main
    file: GitLab/Templates/gitlab-job-templates.yml

variables:
  BuildCacheKey: Tgs.WebToolkits.$CI_PIPELINE_IID

stages:
  - build
  - test
  - publish

build-code:
  extends: .build-code-template

unit-test:
  extends: .unit-test-template

push-nuget:
  extends: .push-nuget-template
  script:
    - push_package "Tgs.WebApi.Toolkits"
    - push_package "Tgs.WebApi.Toolkits.Swashbuckle"
  artifacts:
    paths:
      - Tgs.WebApi.Toolkits/bin/$BuildConfiguration/*.nupkg
      - Tgs.WebApi.Toolkits.Swashbuckle/bin/$BuildConfiguration/*.nupkg
